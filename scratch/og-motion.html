  function buildSky(){

    if(w.pr!=="none"){var n=w.pr==="snow"?90:140;for(var d=0;d<n;d++)drops.push({x:R()*W,y:R()*bot,p:R()*TAU,k:w.pr==="snow"?1+Math.floor(R()*2):9+Math.floor(R()*4)});}
    for(var s2=0;s2<70;s2++)stars.push({x:R()*W,y:top+R()*(bot-top)*0.55,p:R()*TAU,m:1+Math.floor(R()*3)});
    rainTop=0;rainBot=bot+40;
  }
  var rainTop,rainBot;

  var sunX=Math.round(W*0.86), sunR=28;
  function pixDisc(cx,cy,r){var P=PIXEL,x,y;for(y=-r;y<=r;y+=P)for(x=-r;x<=r;x+=P)if(x*x+y*y<=r*r)ctx.fillRect(Math.round(cx+x),Math.round(cy+y),P,P);}
  function drawCelestial(sunY,ph){
    if(C.phase.body==="moon"){ctx.fillStyle=C.moon;pixDisc(sunX,sunY,sunR);ctx.fillStyle=C.bg;pixDisc(sunX+sunR*0.55,sunY-sunR*0.28,sunR*0.92);return;}
    ctx.fillStyle=C.sun;pixDisc(sunX,sunY,sunR);
    if(weather==="cloudy"||weather==="rain"||weather==="snow")return;
    ctx.strokeStyle=C.sun;ctx.lineWidth=Math.max(2,PIXEL-1);
    var rot=ph/8, pulse=Math.sin(ph*2)*2.5;           // rays turn 45deg per loop: 8-fold symmetric, so it loops
    for(var a=0;a<8;a++){var an=a*Math.PI/4+rot,r0=sunR+6,r1=sunR+15+pulse;ctx.beginPath();ctx.moveTo(sunX+Math.cos(an)*r0,sunY+Math.sin(an)*r0);ctx.lineTo(sunX+Math.cos(an)*r1,sunY+Math.sin(an)*r1);ctx.stroke();}
  }
  function drawCloud(cx,cy,s){var m=["..####..",".######.","########",".######."];ctx.fillStyle=C.cloud;for(var r=0;r<m.length;r++){var row=m[r];for(var k=0;k<row.length;k++)if(row.charAt(k)==="#")ctx.fillRect(Math.round(cx+k*s),Math.round(cy+r*s),s,s);}}
  function drawBench(x,seatY,w,ground,cp){ctx.fillStyle=C.T;var pt=Math.max(2,Math.round(cp*1.4));ctx.fillRect(x,seatY,w,pt);ctx.fillRect(x+cp*2,seatY+pt,cp,ground-(seatY+pt));ctx.fillRect(x+w-cp*3,seatY+pt,cp,ground-(seatY+pt));}
  function within(tt,a,b){return tt>=a&&tt<b;}
  // blink / ear-twitch frames, swapped in for a few hundred ms
  var P_BLINK=P_SIT.map(function(r,i){return i===7?".KGGGGGGGGGK.":r;});
  var D_BLINK=D_SIT.map(function(r,i){return i===3?".OOOOOOO.":r;});
  var D_EAR=D_SIT.map(function(r,i){return i===0?"..O......":i===1?".OO...O..":r;});

  function render(tt){
    tt=((tt%LOOP)+LOOP)%LOOP;
    var ph=TAU*tt/LOOP, i, cx, wr, p, w=wx();
    ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
    if(C.d&&w.cl<=2&&w.pr==="none"){ctx.fillStyle=C.star;for(i=0;i<stars.length;i++){p=stars[i];var tw=0.5+0.5*Math.sin(ph*p.m+p.p);if(tw>0.4){ctx.globalAlpha=tw;ctx.fillRect(p.x,p.y,2,2);}}ctx.globalAlpha=1;}
    var sunY=Math.round(H*C.phase.sunY);
    drawCelestial(sunY,ph);
    for(i=0;i<clouds.length;i++){var cl=clouds[i];drawCloud(cl.x+Math.sin(ph+cl.p)*cl.a,cl.y+Math.sin(ph*2+cl.p)*2,cl.s);}
    var span=rainBot-rainTop;
    if(w.pr==="rain"){ctx.strokeStyle=C.rain;ctx.lineWidth=2;ctx.beginPath();for(i=0;i<drops.length;i++){p=drops[i];var y=rainTop+((p.y+span*p.k*tt/LOOP)%span);ctx.moveTo(p.x,y);ctx.lineTo(p.x-2,y+9);}ctx.stroke();}
    else if(w.pr==="snow"){ctx.fillStyle=C.snow;for(i=0;i<drops.length;i++){p=drops[i];var ys=rainTop+((p.y+span*p.k*tt/LOOP)%span);ctx.fillRect(Math.round(p.x+Math.sin(ph*2+p.p)*6),Math.round(ys),3,3);}}
    for(var ci=0;ci<byColor.length;ci++){var a=byColor[ci],rgb=C.houses[ci];ctx.fillStyle="rgba("+rgb[0]+","+rgb[1]+","+rgb[2]+","+C.houseA+")";for(i=0;i<a.length;i+=2)cell(a[i],a[i+1]);}
    // windows: at night a few go dark and come back during the loop
    ctx.fillStyle=C.win;for(i=0;i<lit.length;i+=2){var j=i>>1;if(C.d&&j%23===5&&within(tt,1800+(j%7)*400,4600+(j%5)*500))continue;cell(lit[i],lit[i+1]);}
    var wob=Math.sin(ph);
    for(cx=0;cx<cellsX;cx++){if(colTop[cx]<0)continue;var rg=C.houses[colCol[cx]];ctx.fillStyle="rgba("+rg[0]+","+rg[1]+","+rg[2]+","+C.reflA+")";var depth=Math.min(6,waterBotRow-waterTopRow);for(var k=1;k<=depth;k++){if(Math.sin(cx*0.3+ph*2+k)<0.35)continue;cell(cx+Math.round(wob+Math.sin(ph*2+cx*0.2)),waterTopRow+k);}}
    ctx.fillStyle=C.water;
    for(wr=waterTopRow;wr<=waterBotRow;wr++)for(cx=0;cx<cellsX;cx++)if(Math.sin(cx*0.22+ph*2+wr*0.7)>0.82)cell(cx,wr);
    for(i=0;i<boats.length;i++){var b=boats[i];sprC(BOAT,b.x,b.y+Math.round(Math.sin(ph*2+b.ph)*1.5),PIXEL,C.boat);}
    ctx.fillStyle=C.quay;ctx.fillRect(0,promY,W,Math.max(2,PIXEL-1));
    for(i=0;i<trees.length;i++){var tm=trees[i].v?TREE_B:TREE_A;spr(tm,trees[i].x-Math.floor(tm[0].length/2)*treePix,promY-tm.length*treePix,treePix);}
    var cp=CP, aw=P_SIT[0].length, dw=D_SIT[0].length, dh=D_SIT.length;
    var gap=2*cp, pairW=dw*cp+gap+aw*cp, ground=promY, ccx=Math.round(W/2-pairW/2), seatY=ground-5*cp;
    drawBench(ccx-cp,seatY,pairW+2*cp,ground,cp);
    var sandoX=ccx, amrithX=ccx+dw*cp+gap;
    var dog=within(tt,2400,2560)||within(tt,6900,7060)?D_BLINK:within(tt,4600,5000)?D_EAR:D_SIT;
    var me=within(tt,1100,1260)||within(tt,5600,5760)?P_BLINK:P_SIT;
    spr(dog,sandoX,seatY-dh*cp,cp);
    spr(me,amrithX,seatY-16*cp,cp);
    ctx.fillStyle=C.d?"rgba(236,227,211,0.92)":"rgba(33,28,22,0.9)";
    ctx.font='34px "Departure Mono", ui-monospace, monospace';
    ctx.textAlign="left"; ctx.textBaseline="middle";
    ctx.fillText("@amrith", Math.round(W*0.05), Math.round(H*0.15));
    ctx.textBaseline="alphabetic";
  }
  window.__render=render;
  window.__frame=function(tt){render(tt);return canvas.toDataURL("image/png");};
  window.__loop=LOOP;
  var t0=performance.now();
  function tick(now){render(now-t0);requestAnimationFrame(tick);}
  function restart(){C=pal();buildSky();}
  document.querySelectorAll("[data-w]").forEach(function(b){b.classList.toggle("on",b.dataset.w===weather);b.onclick=function(){weather=b.dataset.w;document.querySelectorAll("[data-w]").forEach(function(x){x.classList.toggle("on",x===b);});restart();};});
  document.querySelectorAll("[data-s]").forEach(function(b){b.classList.toggle("on",b.dataset.s===sky);b.onclick=function(){sky=b.dataset.s;document.querySelectorAll("[data-s]").forEach(function(x){x.classList.toggle("on",x===b);});restart();};});
  function go(){build();window.__ready=true;if(!capture)requestAnimationFrame(tick);else render(0);}
  if(document.fonts&&document.fonts.load)document.fonts.load('30px "Departure Mono"').then(go,go);else go();
})();
</script>
</body>
</html>
