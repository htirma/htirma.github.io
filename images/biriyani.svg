<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#f6f1e7"/>

  <!-- Top rule -->
  <line x1="80" y1="100" x2="1120" y2="100" stroke="#2b1c15" stroke-width="1" opacity="0.18"/>

  <!-- Kicker -->
  <text x="80" y="80" font-family="Manrope, system-ui, sans-serif" font-size="20" font-weight="600" letter-spacing="6" fill="#bf6f24">
